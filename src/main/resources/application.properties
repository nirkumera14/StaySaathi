server.port=${PORT:8080}

spring.application.name=pg-platform
spring.datasource.url=jdbc:h2:file:./data/pgplatform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.admin-key=${APP_ADMIN_KEY:pg-admin-2026}
app.google-maps.enabled=${GOOGLE_MAPS_ENABLED:false}
app.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,https://nirkumera14.github.io}
