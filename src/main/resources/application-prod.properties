spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pgplatform}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

app.google-maps.enabled=${GOOGLE_MAPS_ENABLED:true}
app.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,https://nirkumera14.github.io}
